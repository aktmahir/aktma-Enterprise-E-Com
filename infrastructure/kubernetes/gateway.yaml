apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: enterprise-ecommerce/gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ASPNETCORE_URLS, value: http://+:8080 }
            - { name: Services__Catalog, value: http://catalog-api }
            - { name: Services__Identity, value: http://identity-api }
            - { name: Services__Orders, value: http://orders-api }
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ecommerce
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-gateway
  namespace: ecommerce
spec:
  rules:
    - host: ecommerce.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }